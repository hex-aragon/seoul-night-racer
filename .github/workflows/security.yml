name: Secret and public-file checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check tracked files and newly introduced secrets
        env:
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/check-public-files.py
          snapshot=$(mktemp -d)
          git archive HEAD | tar -x -C "$snapshot"
          gitleaks dir "$snapshot" --redact=100 --no-banner
          if [[ "$AUDIT_BASE" =~ ^[0-9a-f]{40}$ && "$AUDIT_BASE" != 0000000000000000000000000000000000000000 ]]; then
            gitleaks git . --redact=100 --no-banner --log-opts="$AUDIT_BASE..HEAD"
          else
            gitleaks git . --redact=100 --no-banner --log-opts="-1"
          fi
